<div class="login-container">
    <h2> Admin Login</h2>

    <form (ngSubmit)="onLogin()">
        <div>
            <label for="email">Email</label><br>
            <input
                type="email"
                id="email"
                name="email"
                [(ngModel)]="email"
                required>
        </div>

        <br>

        <div>
            <label for="password">Password</label><br>
            <input
                type="password"
                id="password"
                name="password"
                [(ngModel)]="password"
                required>
        </div>

        <br>

        <button type="submit">Login</button>
    </form>
    </div>
